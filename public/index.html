<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mortadello</title><meta name="description" content="A two-player card game of nerve, timing and luck."><link rel="stylesheet" href="/styles.css"></head><body><main id="lobby" class="lobby"><div class="lobby__card"><div class="brand-mark">M</div><p class="eyebrow">A TWO-PLAYER CARD GAME</p><h1>MORTADELLO</h1><p class="lobby__intro">A graceful game of nerve, timing and the cards you dare to turn over.</p><div id="lobby-actions" class="lobby__actions"><button id="create" class="primary">Create game</button><button id="show-join" class="secondary">Join game</button></div><div id="join-panel" class="room-panel" hidden><label for="room-code">ROOM CODE</label><input id="room-code" placeholder="MORT-7K4P"><button id="join" class="primary">Join game</button></div><div id="waiting-panel" class="room-panel" hidden><span class="room-panel__label">YOUR ROOM CODE</span><strong id="room-display"></strong><p>Share this invite with your opponent.</p><button id="copy" class="primary">Copy invite link</button><code id="invite" class="invite-url"></code></div><p id="error" class="form-error"></p></div></main>
<main id="game-shell" class="game-shell" hidden><div class="board"><header class="game-topbar"><div class="topbar-left"><button class="icon-button" aria-label="Open menu">☰</button></div><span id="turn" class="turn-pill">Opponent</span><div class="topbar-actions"><button class="icon-button" aria-label="Settings">⚙</button><button class="icon-button" aria-label="Open chat">◯</button></div></header><section class="opponent-hand hand-panel"><h2>Opponent’s Hand <span id="opp-count"></span></h2><div id="opp-hand" class="opponent-cards"></div></section><section id="opp-table" class="opponent-table table-row" aria-label="Opponent table cards"></section><section class="piles"><div class="pile"><div class="pile-stack"><div id="discard"></div><i></i><i></i></div><span>Discard Pile</span></div><div class="pile"><div class="pile-stack"><button class="card card--back" aria-label="Draw pile"><span class="card__star">★</span></button><i></i><i></i></div><span>Draw Pile <b id="draw-count"></b></span></div></section><section id="player-table" class="player-table table-row" aria-label="Your table cards"></section><span class="you-pill">You</span><section class="your-hand hand-panel"><h2>Your Hand <span id="hand-count"></span></h2><div id="hand" class="hand-scroll"></div></section><aside id="status" class="status-message" aria-live="polite"></aside><div class="game-actions"><button id="pickup" class="pickup">Pick up</button><button id="play" class="end-turn">Select a card</button></div></div></main><script src="/client.js"></script></body></html>
